[package]
name = "crw-browser-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Idle-reaping REST bridge that consolidates the camofox-browser interactive API into a single action-dispatch endpoint for lightweight agent clients"

[[bin]]
name = "crw-browser-bridge"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
# Adds the `query` feature on top of the workspace default set (needed for
# RequestBuilder::query — GET params on snapshot/console/errors/screenshot).
reqwest = { workspace = true, features = ["query"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
dashmap = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
axum-test = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }
